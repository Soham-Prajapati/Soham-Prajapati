<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="The Soup Review, five stars. Production AI not demos: 220+ of 411 MCP tools in a live ERP (Engaze). Guardrails by default: red-team auth tests, permission drift fails the build (Engaze). Ships to real users: Soupz on npm and Homebrew, 280+ downloads. Taste: Best UI/UX among 800+ teams (SPIT Hacks). Builds the stage too: HackFusion site, 3,000+ registrations (IEEE SPIT). Automates the boring: a monthly filing from 4–5 days to under 2 hours (Engaze). Only complaint: orders a website, gets an operating system.">
<style>
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sf{font-family:Georgia,'Times New Roman',serif}
  .ink{fill:#26201C}.mu{fill:#6E625B}.or{fill:#D04A31}.gr{fill:#2F7A3D}
  .chip{fill:#FBDCD2;stroke:#EBCDB9}
  .r{animation:in .35s ease-out both}
  .r1{animation-delay:.2s}.r2{animation-delay:.4s}.r3{animation-delay:.6s}.r4{animation-delay:.8s}.r5{animation-delay:1s}.r6{animation-delay:1.2s}.r7{animation-delay:1.6s}
  @keyframes in{from{opacity:0}to{opacity:1}}
  .star{animation:pop .3s cubic-bezier(.3,1.7,.6,1) both;transform-box:fill-box;transform-origin:center}
  .st1{animation-delay:.3s}.st2{animation-delay:.42s}.st3{animation-delay:.54s}.st4{animation-delay:.66s}.st5{animation-delay:.78s}
  @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  .stamp{animation:stamp .35s cubic-bezier(.3,1.6,.6,1) 2s both;transform-origin:772px 96px}
  @keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-14deg)}to{opacity:.92;transform:scale(1) rotate(-7deg)}}
  @media (prefers-reduced-motion:reduce){.r,.star,.stamp{animation:none}}
</style>
<rect width="900" height="540" rx="16" fill="#F8EBE1"/>
<rect width="900" height="8" rx="4" fill="#D04A31"/>
<text x="40" y="56" class="sf ink" font-size="28">The Soup Review</text>
<text x="40" y="80" class="m mu" font-size="12">an inspection, with receipts · every claim has a source</text>
<g class="m" font-size="13">
  <text x="40" y="116" class="mu">DISH</text><text x="110" y="116" class="ink" font-weight="700">Soham “Soup” Prajapati</text>
  <text x="40" y="142" class="mu">RATING</text>
</g>
<g class="or">
  <path class="star st1" d="M120 128l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7-3.7-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z"/>
  <path class="star st2" d="M144 128l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7-3.7-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z"/>
  <path class="star st3" d="M168 128l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7-3.7-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z"/>
  <path class="star st4" d="M192 128l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7-3.7-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z"/>
  <path class="star st5" d="M216 128l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9-7-3.7-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z"/>
</g>
<g class="stamp"><rect x="682" y="68" width="180" height="56" rx="8" fill="none" stroke="#D04A31" stroke-width="3"/>
  <text x="772" y="94" text-anchor="middle" class="m or" font-size="15" font-weight="700">CHEF’S KISS</text>
  <text x="772" y="113" text-anchor="middle" class="m or" font-size="11">inspected · approved</text></g>
<line x1="40" y1="166" x2="860" y2="166" stroke="#EBD3C4"/>
<text x="40" y="194" class="m mu" font-size="12" letter-spacing="1.5">WHAT THE CRITICS FOUND</text>
<g class="m" font-size="14">
  <g class="r r1"><text x="40" y="226" class="ink" font-weight="700">Production AI, not demos</text><text x="292" y="226" class="mu">220+ of 411 MCP tools in a live ERP</text>
    <rect x="732" y="211" width="128" height="22" rx="11" class="chip"/><text x="796" y="226" text-anchor="middle" class="or" font-size="12">Engaze ✓</text></g>
  <g class="r r2"><text x="40" y="260" class="ink" font-weight="700">Guardrails by default</text><text x="292" y="260" class="mu">red-team auth tests; drift fails the build</text>
    <rect x="732" y="245" width="128" height="22" rx="11" class="chip"/><text x="796" y="260" text-anchor="middle" class="or" font-size="12">Engaze ✓</text></g>
  <g class="r r3"><text x="40" y="294" class="ink" font-weight="700">Ships to real users</text><text x="292" y="294" class="mu">Soupz on npm + Homebrew · 280+ downloads</text>
    <rect x="732" y="279" width="128" height="22" rx="11" class="chip"/><text x="796" y="294" text-anchor="middle" class="or" font-size="12">npm ✓</text></g>
  <g class="r r4"><text x="40" y="328" class="ink" font-weight="700">Taste</text><text x="292" y="328" class="mu">Best UI/UX among 800+ teams</text>
    <rect x="732" y="313" width="128" height="22" rx="11" class="chip"/><text x="796" y="328" text-anchor="middle" class="or" font-size="12">SPIT Hacks ✓</text></g>
  <g class="r r5"><text x="40" y="362" class="ink" font-weight="700">Builds the stage too</text><text x="292" y="362" class="mu">HackFusion site · 3,000+ registrations</text>
    <rect x="732" y="347" width="128" height="22" rx="11" class="chip"/><text x="796" y="362" text-anchor="middle" class="or" font-size="12">IEEE SPIT ✓</text></g>
  <g class="r r6"><text x="40" y="396" class="ink" font-weight="700">Automates the boring</text><text x="292" y="396" class="mu">a monthly filing: 4–5 days → under 2 hours</text>
    <rect x="732" y="381" width="128" height="22" rx="11" class="chip"/><text x="796" y="396" text-anchor="middle" class="or" font-size="12">Engaze ✓</text></g>
</g>
<line x1="40" y1="424" x2="860" y2="424" stroke="#EBD3C4"/>
<g class="r r7 m" font-size="14">
  <text x="40" y="452" class="mu" font-size="12" letter-spacing="1.5">THE ONLY COMPLAINTS</text>
  <text x="40" y="482" class="ink">• portions too ambitious: orders a portfolio, gets an operating system</text>
  <text x="40" y="508" class="ink">• will name your next project after soup</text>
</g>
</svg>
