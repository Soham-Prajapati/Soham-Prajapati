<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img" aria-label="MCP, slow-simmered: 220+ of 411 tools for a college ERP, each permission-checked before it runs">
<style>.sf{font-family:Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{animation:in .45s ease-out 0.12s both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.go{}@keyframes nudge{50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.c,.go{animation:none}}</style>
<g class="c"><rect x="2" y="2" width="436" height="146" rx="14" fill="#FBF1E1" stroke="#E6C48E" stroke-width="1.5"/>
<text x="24" y="44" class="sf" font-size="22" font-weight="700" fill="#2A2018">MCP, slow-simmered</text>
<text x="24" y="66" class="sf" font-size="13" font-style="italic" fill="#C8741F">Engaze</text>
<text x="24" y="98" class="sf" font-size="14" font-style="italic" fill="#7A6652">220+ of 411 tools for a college ERP,</text>
<text x="24" y="120" class="sf" font-size="14" font-style="italic" fill="#7A6652">each permission-checked before it runs</text>
<g class="go"><text x="414" y="44" class="m" font-size="13" fill="#C8741F" text-anchor="end">under NDA</text></g></g>
</svg>